spring:
  application:
    name: apesc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?sslmode=disable}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: SELECT 1
      maximum-pool-size: 5
  
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: ${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
        format_sql: true
    open-in-view: false

server:
  port: 8080

app:
  jwt:
    # HS256: segredo com no mínimo 32 bytes. Em produção defina APP_JWT_SECRET.
    secret: ${APP_JWT_SECRET:apesc-dev-secret-troque-em-producao-0123456789}
    # Validade do token de acesso, em segundos (padrão: 1 hora).
    expiration: ${APP_JWT_EXPIRATION:3600}
  bootstrap-admin:
    # Cria um funcionário administrador no primeiro start se não houver nenhum
    # funcionário com senha cadastrada. Desative com APP_BOOTSTRAP_ADMIN_ENABLED=false.
    enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:true}
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@apesc.local}
    senha: ${APP_BOOTSTRAP_ADMIN_SENHA:admin12345}
    nome: ${APP_BOOTSTRAP_ADMIN_NOME:Administrador APESC}

logging:
  level:
    com.example.apesc: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
